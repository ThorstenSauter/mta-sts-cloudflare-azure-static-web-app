name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

  validate:
    name: Validate Terraform configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Terraform configuration
        uses: ThorstenSauter/terraform-actions/validate@f4c5a856f2401bb96f67794d5761482fd759ed24 # v1.9.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          infra-directory: .

  docs:
    name: Check Terraform documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install terraform-docs
        # Installed from the release rather than via terraform-docs/gh-actions, whose Docker image bundles its own
        # terraform-docs version: the check has to run the same version the README is generated with locally, or
        # formatting changes between versions show up as drift.
        env:
          TERRAFORM_DOCS_VERSION: v0.24.0
          TERRAFORM_DOCS_SHA256: 9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3
        run: |
          archive="terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/$archive"
          echo "$TERRAFORM_DOCS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" terraform-docs
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Fails instead of pushing the regenerated README back: a bot commit would be unsigned, and main requires
      # signed commits.
      - name: Check README is up to date
        run: |
          terraform-docs .
          if ! git diff --exit-code -- README.md; then
            echo "::error::README.md is out of date. Run 'terraform-docs .' in the repository root and commit the result."
            exit 1
          fi

  checks-passed:
    name: CI passed
    runs-on: ubuntu-slim
    needs: [ lint, validate, docs ]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Fail if a check failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "::error::At least one check failed, was cancelled or was skipped."
          echo "$RESULTS"
          exit 1
      - name: All checks passed
        run: echo "Every check passed."
